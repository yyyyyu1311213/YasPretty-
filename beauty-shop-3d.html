<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YASPRETTY · ins 风美妆小店</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #f8eee9;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }

    /* ===== 3D 视口容器：所有尺寸都以它为准，便于整块嵌入网页 ===== */
    #beautyShop3d {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 320px;
      overflow: hidden;
      background:
        radial-gradient(90% 70% at 50% 62%, rgba(255, 170, 120, 0.16) 0%, rgba(255, 170, 120, 0) 60%),
        radial-gradient(120% 95% at 50% 4%, #fff7f2 0%, #f5e5dd 46%, #ecd8cf 100%);
      touch-action: none;     /* 触屏手势交给 OrbitControls */
      cursor: grab;
    }
    #beautyShop3d:active { cursor: grabbing; }

    /* three.js 生成的 canvas 始终铺满容器 */
    #beautyShop3d canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== 画面暗角，把注意力压到店铺上 ===== */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(70% 65% at 52% 48%, rgba(0, 0, 0, 0) 48%, rgba(120, 88, 74, 0.08) 100%);
    }

  </style>

</head>
<body>
  <div id="beautyShop3d">
    <div class="vignette"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createVanityCosmetic, createVanitySceneModel, vanityProductPosition } from '/src/features/makeup-table/makeup-table-3d/vanity-models.js';

    /* ===============================================================
     * 0. 基础配置与工具
     * ============================================================= */
    const container = document.getElementById('beautyShop3d');

    // 沙盘地块：整个街区就是一块独立的方形底座
    const DIORAMA = {
      size: 15.2,        // 地块边长
      baseDepth: 1.0,    // 展示地台厚度（约为原来的三分之一）
      rimHeight: 0.16,   // 底座顶沿
    };

    const CONFIG = {
      camera: {
        fov: 49,
        near: 0.1,
        far: 160,
        // 斜俯视 45° 方位：一次看全整个沙盘，底座前侧与右侧可见
        position: new THREE.Vector3(12.00165, 10.150974, 12.080645),
        target: new THREE.Vector3(0, 0.72, 0.35),
      },
      maxPixelRatio: 1.25,
      // 相机距离限制：不能钻进地块里，也不能跑太远
      minDistance: 12,
      maxDistance: 34,
    };

    const SHOP = {
      width: 7.2,
      depth: 5.4,
      wallHeight: 3.55,
      wallThickness: 0.24,
      openingHalfWidth: 2.5,
      glassBottom: 0.30,
      glassTop: 2.83,
      fasciaHeight: 0.72,
      interiorFloorY: 0.24,
    };

    const STREET = {
      roadDepth: 4.4,       // 主街（东西向）路面宽
      sideRoadWidth: 2.2,   // 侧街（南北向）路面宽
      sidewalkDepth: 2.2,   // 店铺前人行道进深
      sideRoadX: 4.4,       // 右侧马路起点
      sidewalkY: 0.11,      // 人行道抬高，路缘石形成明确高差
    };

    const INTRO_DURATION = 4.8;

    // 入场时间轴：地台先出现，地面再从中心向外扩散，随后进入街景与店铺生长
    const TIMELINE = {
      ground: [0.65, 1.45],
      lamps: [0.9, 1.5],
      streetProps: [1.25, 1.9],
      shop: [1.5, 2.85],
      fixtures: [2.75, 3.45],
      forecourt: [2.7, 3.55],
      products: [3.5, 4.35],
    };

    // 可交互对象注册表：商品在创建时就 push 进来（射线拾取用）
    const interactiveObjects = [];

    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const smooth = (v) => v * v * (3 - 2 * v);
    const easeOutCubic = (v) => 1 - Math.pow(1 - v, 3);
    const easeOutBack = (v) => {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(v - 1, 3) + c1 * Math.pow(v - 1, 2);
    };
    const span = (t, a, b) => clamp01((t - a) / (b - a));

    /* ===============================================================
     * 1. 渲染器（挂载到 #beautyShop3d，不碰 document.body）
     * ============================================================= */
    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      alpha: true,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    // 静态场景：阴影只算一次；入场动画期间会临时逐帧刷新
    renderer.shadowMap.autoUpdate = false;
    renderer.shadowMap.needsUpdate = true;
    container.appendChild(renderer.domElement);

    /* ===============================================================
     * 2. 场景 + 程序化环境贴图（玻璃/金属反光，无外部图片）
     * ============================================================= */
    const scene = new THREE.Scene();
    scene.background = null;
    scene.fog = new THREE.Fog(0xf0ddd4, 16, 44);

    // 粉色背景（回到之前的粉白调）：柔和竖向渐变，代替夜景天空
    function createPinkBackdropTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const sky = ctx.createLinearGradient(0, 0, 0, 512);
      sky.addColorStop(0.0, '#f7ece6');
      sky.addColorStop(0.34, '#f5e2da');
      sky.addColorStop(0.5, '#f0dbd2');
      sky.addColorStop(0.62, '#eedbd2');
      sky.addColorStop(1.0, '#e4cdc4');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1024, 512);

      const tex = new THREE.CanvasTexture(canvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // 夜空环境贴图：深蓝夜空 + 地平线暖光 + 一轮月亮（玻璃/金属反光用）
    function createEnvironmentTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const sky = ctx.createLinearGradient(0, 0, 0, 512);
      sky.addColorStop(0.0, '#050a10');
      sky.addColorStop(0.34, '#0a1622');
      sky.addColorStop(0.48, '#13283a');
      sky.addColorStop(0.54, '#2a3140');
      sky.addColorStop(0.58, '#191a1d');
      sky.addColorStop(1.0, '#070a0d');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 1024, 512);

      // 城市灯火压在地平线上（暖色带）
      const city = ctx.createLinearGradient(0, 250, 0, 310);
      city.addColorStop(0.0, 'rgba(255, 168, 106, 0)');
      city.addColorStop(0.45, 'rgba(255, 150, 86, 0.22)');
      city.addColorStop(0.75, 'rgba(255, 128, 70, 0.10)');
      city.addColorStop(1.0, 'rgba(255, 128, 70, 0)');
      ctx.fillStyle = city;
      ctx.fillRect(0, 250, 1024, 60);

      // 月亮
      const moon = ctx.createRadialGradient(300, 118, 4, 300, 118, 88);
      moon.addColorStop(0.0, 'rgba(255, 250, 238, 0.95)');
      moon.addColorStop(0.18, 'rgba(226, 236, 255, 0.55)');
      moon.addColorStop(0.6, 'rgba(150, 180, 220, 0.12)');
      moon.addColorStop(1.0, 'rgba(120, 150, 200, 0)');
      ctx.fillStyle = moon;
      ctx.fillRect(180, 0, 260, 260);

      const tex = new THREE.CanvasTexture(canvas);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envSource = createEnvironmentTexture();
    const envRT = pmrem.fromEquirectangular(envSource);
    scene.environment = envRT.texture;

    // 背景交回粉白渐变（回到之前的粉色背景）
    scene.background = createPinkBackdropTexture();
    scene.backgroundIntensity = 1;
    scene.environmentIntensity = 0.55;
    envSource.dispose();
    pmrem.dispose();

    /* ===============================================================
     * 3. 相机
     * ============================================================= */
    const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, 1, CONFIG.camera.near, CONFIG.camera.far);
    // 光斑与发光贴花使用 layer 1，主相机仍需渲染这一层。
    camera.layers.enable(1);
    camera.position.copy(CONFIG.camera.position);
    camera.lookAt(CONFIG.camera.target);

    /* ===============================================================
     * 4. 夜间灯光：弱月光 + 冷环境，暖光交给店铺橱窗与路灯
     * ============================================================= */
    const ambientLight = new THREE.AmbientLight(0xffe9df, 0.3);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffe8dc, 0x5f4a52, 0.68);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffeee3, 0.48);
    keyLight.position.set(6.5, 12, 7.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 46;
    keyLight.shadow.camera.left = -14;
    keyLight.shadow.camera.right = 14;
    keyLight.shadow.camera.top = 14;
    keyLight.shadow.camera.bottom = -14;
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.022;
    keyLight.shadow.radius = 4;
    scene.add(keyLight);

    // 冷色补光：让夜晚的店外墙不至于死黑
    const fillLight = new THREE.DirectionalLight(0xf5c9bd, 0.32);
    fillLight.position.set(-9, 6, -5);
    scene.add(fillLight);

    /* ===============================================================
     * 5. 夜间街区：人行道 / 马路 / 斑马线 / 街景道具 / 城市背景
     *    所有街景材质统一登记，0 ~ 1.2s 一起淡入
     * ============================================================= */
    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // 街景道具改用原地缩放入场，材质保持不透明
    const streetFade = [];
    const streetGlow = [];
    const streetShadowProps = [];     // 街道投影网格

    function solidStreetMaterial(material) {
      return material;
    }

    function glowStreetMaterial(material, target) {
      material.transparent = true;
      material.opacity = 0;
      streetGlow.push({ material, target });
      return material;
    }

    /* ---------- 程序化贴图 ---------- */
    // 人行道：浅灰方形地砖 + 清晰网格接缝 + 细颗粒 + 微弱湿光
    function createPavingTexture(size = 512, tiles = 6) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const random = mulberry32(4177);
      const cell = size / tiles;

      // 接缝底色
      ctx.fillStyle = '#20262c';
      ctx.fillRect(0, 0, size, size);

      // 逐块地砖：轻微色差，让网格不是机械复读
      for (let row = 0; row < tiles; row++) {
        for (let col = 0; col < tiles; col++) {
          const tone = 0.92 + random() * 0.16;
          const r = Math.round(114 * tone);
          const g = Math.round(121 * tone);
          const b = Math.round(128 * tone);
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.fillRect(col * cell + 2, row * cell + 2, cell - 4, cell - 4);

          // 每块砖上的细颗粒
          const grain = 30 + Math.floor(random() * 20);
          for (let i = 0; i < grain; i++) {
            const x = col * cell + 4 + random() * (cell - 8);
            const y = row * cell + 4 + random() * (cell - 8);
            ctx.globalAlpha = 0.06 + random() * 0.12;
            ctx.fillStyle = random() > 0.55 ? '#d5dbe0' : '#1e252c';
            ctx.fillRect(x, y, 1 + random() * 1.6, 1 + random() * 1.6);
          }
          ctx.globalAlpha = 1;

          // 轻微磨损 / 水渍
          if (random() > 0.55) {
            const wx = col * cell + 4 + random() * (cell - 12);
            const wy = row * cell + 4 + random() * (cell - 12);
            const wr = 3 + random() * 9;
            const wg = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
            wg.addColorStop(0, random() > 0.5 ? 'rgba(214, 226, 236, 0.10)' : 'rgba(12, 16, 20, 0.12)');
            wg.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = wg;
            ctx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
          }

          // 很淡的湿面反光，避免整片死灰
          const sheen = ctx.createLinearGradient(col * cell, row * cell, col * cell + cell, row * cell + cell);
          sheen.addColorStop(0, 'rgba(205, 220, 234, 0.05)');
          sheen.addColorStop(0.5, 'rgba(205, 220, 234, 0)');
          sheen.addColorStop(1, 'rgba(8, 12, 16, 0.11)');
          ctx.fillStyle = sheen;
          ctx.fillRect(col * cell + 2, row * cell + 2, cell - 4, cell - 4);
        }
      }

      // 接缝高光，强化网格
      ctx.strokeStyle = 'rgba(190, 205, 220, 0.16)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tiles; i++) {
        const p = cell * i + 0.5;
        ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(size, p); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, size); ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    function createAsphaltTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const random = mulberry32(90210);

      ctx.fillStyle = '#232a33';
      ctx.fillRect(0, 0, size, size);

      // 大块斑驳：模拟沥青修补痕 / 油渍 / 潮湿色差
      for (let i = 0; i < 44; i++) {
        const x = random() * size;
        const y = random() * size;
        const r = 14 + random() * 86;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        const dark = random() > 0.5;
        g.addColorStop(0, dark ? 'rgba(2, 4, 6, 0.24)' : 'rgba(146, 158, 172, 0.15)');
        g.addColorStop(0.6, dark ? 'rgba(4, 6, 9, 0.10)' : 'rgba(130, 142, 156, 0.06)');
        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      // 中等尺度补丁：让路面在弱光下也有层次
      for (let i = 0; i < 70; i++) {
        const x = random() * size;
        const y = random() * size;
        const r = 8 + random() * 34;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, random() > 0.5 ? 'rgba(150, 162, 176, 0.08)' : 'rgba(3, 5, 8, 0.12)');
        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      // 细颗粒（亮骨料 + 暗砂）
      for (let i = 0; i < 6500; i++) {
        const x = random() * size;
        const y = random() * size;
        ctx.globalAlpha = 0.05 + random() * 0.14;
        ctx.fillStyle = random() > 0.6 ? '#a8b3bf' : '#03060a';
        const s = 0.8 + random() * 1.7;
        ctx.fillRect(x, y, s, s);
      }
      ctx.globalAlpha = 1;

      // 细小不规则斑驳 / 裂纹
      ctx.strokeStyle = 'rgba(4, 7, 10, 0.30)';
      for (let i = 0; i < 22; i++) {
        ctx.lineWidth = 0.5 + random() * 1.0;
        let x = random() * size;
        let y = random() * size;
        ctx.beginPath();
        ctx.moveTo(x, y);
        const segs = 2 + Math.floor(random() * 4);
        for (let s = 0; s < segs; s++) {
          x += (random() - 0.5) * 24;
          y += (random() - 0.5) * 24;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 1);
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    // A 字立牌宣传面：低饱和粉白 + YASPRETTY / 今日美妆
    function createBoardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 720;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 0, 720);
      bg.addColorStop(0, '#fbf1ee');
      bg.addColorStop(0.55, '#f7e6e3');
      bg.addColorStop(1, '#efd7d4');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 512, 720);

      // 纸面细颗粒
      const random = mulberry32(77031);
      for (let i = 0; i < 1800; i++) {
        ctx.globalAlpha = 0.025 + random() * 0.04;
        ctx.fillStyle = random() > 0.5 ? '#ffffff' : '#b98b8b';
        ctx.fillRect(random() * 512, random() * 720, 1.4, 1.4);
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = '#cfaeaa';
      ctx.lineWidth = 3;
      ctx.strokeRect(26, 26, 460, 668);
      ctx.strokeStyle = 'rgba(207, 174, 170, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(38, 38, 436, 644);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 顶部小字
      ctx.fillStyle = '#a97e7e';
      ctx.font = '500 26px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.fillText('BEAUTY  SELECT', 256, 92);

      // 主品牌
      ctx.fillStyle = '#6c5050';
      ctx.font = '700 58px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.fillText('YASPRETTY', 256, 168);

      // 中间分隔线
      ctx.strokeStyle = '#c9a5a2';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(120, 218);
      ctx.lineTo(392, 218);
      ctx.stroke();

      // 中文主文案
      ctx.fillStyle = '#8d6264';
      ctx.font = '600 92px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('今日美妆', 256, 332);

      ctx.fillStyle = '#9d7778';
      ctx.font = '400 34px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('新品到店 · 试妆有礼', 256, 412);

      // 圆形小装饰
      ctx.strokeStyle = '#d4b3af';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(256, 500, 52, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#b88788';
      ctx.font = '700 30px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.fillText('OPEN', 256, 502);

      ctx.fillStyle = '#aa8787';
      ctx.font = '400 24px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('10:00 — 22:00', 256, 596);

      // 底部小字
      ctx.fillStyle = '#bda09d';
      ctx.font = '400 20px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.fillText('YASPRETTY BEAUTY STORE', 256, 650);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    // 街角路牌：美妆街 / YASPRETTY
    function createStreetSignTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 320;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createLinearGradient(0, 0, 0, 320);
      bg.addColorStop(0, '#f6f4ec');
      bg.addColorStop(1, '#e9e6dc');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 512, 320);

      // 干净底板：只留一圈细边框，去掉双线装饰
      ctx.strokeStyle = 'rgba(90, 99, 94, 0.55)';
      ctx.lineWidth = 3;
      ctx.strokeRect(18, 18, 476, 284);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = '#37433f';
      ctx.font = '700 96px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('美妆街', 256, 108);

      ctx.fillStyle = '#6f7b74';
      ctx.font = '600 30px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.fillText('BEAUTY  STREET', 256, 186);

      ctx.fillStyle = '#98a19a';
      ctx.font = '400 20px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.fillText('YASPRETTY  ·  2 丁目', 256, 240);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;

    function createBuildingTexture(seed, cols, rows) {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const random = mulberry32(seed);

      ctx.fillStyle = '#0d1620';
      ctx.fillRect(0, 0, size, size);

      const cellW = size / cols;
      const cellH = size / rows;
      const mx = cellW * 0.3;
      const my = cellH * 0.34;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const roll = random();
          let fill = 'rgba(12, 18, 26, 0.95)';
          if (roll > 0.87) fill = `rgba(255, 206, 152, ${0.45 + random() * 0.5})`;
          else if (roll > 0.8) fill = `rgba(176, 206, 250, ${0.22 + random() * 0.35})`;
          else if (roll > 0.72) fill = 'rgba(46, 68, 92, 0.4)';
          ctx.fillStyle = fill;
          ctx.fillRect(c * cellW + mx, r * cellH + my, cellW - mx * 2, cellH - my * 2);
        }
      }

      // 楼层线
      ctx.fillStyle = 'rgba(120, 150, 190, 0.035)';
      for (let r = 1; r < rows; r++) {
        ctx.fillRect(0, r * cellH - 1, size, 1.4);
      }

      // 顶端一点冷光，交代楼顶轮廓
      const top = ctx.createLinearGradient(0, 0, 0, 22);
      top.addColorStop(0, 'rgba(140, 175, 215, 0.1)');
      top.addColorStop(1, 'rgba(140, 175, 215, 0)');
      ctx.fillStyle = top;
      ctx.fillRect(0, 0, size, 22);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPoolTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const g = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2);
      g.addColorStop(0.0, 'rgba(255, 226, 196, 0.85)');
      g.addColorStop(0.3, 'rgba(255, 198, 148, 0.42)');
      g.addColorStop(0.62, 'rgba(255, 176, 118, 0.12)');

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;

    }

    /* ---------- 程序化细微肌理：墙面 / 招牌 / 金属 / 玻璃 / 铭牌 ---------- */
    function createWallGrainTexture(size = 256) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const random = mulberry32(5521);

      ctx.fillStyle = '#f7f0ea';
      ctx.fillRect(0, 0, size, size);

      // 极淡的大块抹灰色差
      for (let i = 0; i < 18; i++) {
        const x = random() * size;
        const y = random() * size;
        const r = 18 + random() * 60;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        const light = random() > 0.5;
        g.addColorStop(0, light ? 'rgba(255, 255, 255, 0.10)' : 'rgba(196, 180, 168, 0.06)');
        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      // 细颗粒
      for (let i = 0; i < 3200; i++) {
        const x = random() * size;
        const y = random() * size;
        ctx.globalAlpha = 0.02 + random() * 0.05;
        ctx.fillStyle = random() > 0.5 ? '#ffffff' : '#c4b2a5';
        ctx.fillRect(x, y, 0.8 + random() * 1.4, 0.8 + random() * 1.4);
      }
      ctx.globalAlpha = 1;

      // 很浅的批刀纹
      ctx.strokeStyle = 'rgba(206, 190, 176, 0.10)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 14; i++) {
        const y = random() * size;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(size * 0.3, y + (random() - 0.5) * 6, size * 0.7, y + (random() - 0.5) * 6, size, y);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    function createSignGrainTexture(size = 256) {

    function createMetalGrainTexture(size = 256) {

    function createGlassRoughnessTexture(size = 256) {

    /* ---------- 地面层：中心向外环形扩散显影 ---------- */
    const groundReveal = {
      radius: { value: 0 },
      center: { value: new THREE.Vector2(0, 0.4) },
      feather: { value: 1.35 },
    };
    const groundRevealMaterials = [];

    function applyGroundReveal(material) {
      if (!material || material.userData.groundReveal) return material;
      material.userData.groundReveal = true;
      const wasTransparent = !!material.transparent;
      material.transparent = true;
      material.opacity = 1;
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uGroundRadius = groundReveal.radius;
        shader.uniforms.uGroundCenter = groundReveal.center;
        shader.uniforms.uGroundFeather = groundReveal.feather;
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vGroundWorld;'
          )
          .replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvGroundWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;'
          );
        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vGroundWorld;\nuniform float uGroundRadius;\nuniform vec2 uGroundCenter;\nuniform float uGroundFeather;'
          )
          .replace(
            '#include <dithering_fragment>',
            'float gDist = distance(vGroundWorld.xz, uGroundCenter);\n' +
            'float gAlpha = 1.0 - smoothstep(uGroundRadius - uGroundFeather, uGroundRadius, gDist);\n' +
            'gl_FragColor.a *= gAlpha;\n' +
            '#include <dithering_fragment>'
          );
      };
      material.customProgramCacheKey = () => 'ground-reveal';
      const cloneMaterial = material.clone.bind(material);
      material.clone = (...args) => {
        const clone = cloneMaterial(...args);
        clone.onBeforeCompile = material.onBeforeCompile;
        clone.customProgramCacheKey = material.customProgramCacheKey;
        return clone;
      };
      material.needsUpdate = true;
      groundRevealMaterials.push({ material, wasTransparent });
      return material;
    }

    const wallGrainTex = createWallGrainTexture();
    const signGrainTex = createSignGrainTexture();
    const metalGrainTex = createMetalGrainTexture();
    const glassRoughTex = createGlassRoughnessTexture();

    /* ---------- 沙盘底座与街景 ---------- */
    const BLOCK = DIORAMA.size;
    const BLOCK_HALF = BLOCK / 2;
    const ROAD_NEAR = STREET.sidewalkDepth;              // 主街北缘 z = 2.2
    const SIDE_ROAD_X = STREET.sideRoadX;                // 侧街西缘 x = 4.4
    const SIDEWALK_Y = STREET.sidewalkY;
    const ROAD_Y = 0.02;
    const MARK_Y = ROAD_Y + 0.012;

    const FAR_W = 1.0;                                   // 对街人行道宽
    const ROAD_FAR = BLOCK_HALF - FAR_W;                 // 主街南缘 z = 6.6
    const SIDE_ROAD_FAR = BLOCK_HALF - FAR_W;            // 侧街东缘 x = 6.6
    const NW_R = 0.8;                                    // 店铺转角圆弧
    const FAR_R = 0.5;                                   // 对街三个转角圆弧
    const ROAD_UV = 3.2;
    const PAVING_UV = 3.6;

    // 四个路口转角：NW 是店铺地块，其余三个是对街人行道
    const NW = { cx: SIDE_ROAD_X - NW_R, cz: ROAD_NEAR - NW_R, r: NW_R };
    const SW = { cx: SIDE_ROAD_X - FAR_R, cz: ROAD_FAR + FAR_R, r: FAR_R };
    const NE = { cx: SIDE_ROAD_FAR + FAR_R, cz: ROAD_NEAR - FAR_R, r: FAR_R };
    const SE = { cx: SIDE_ROAD_FAR + FAR_R, cz: ROAD_FAR + FAR_R, r: FAR_R };

    // 底座外的“虚空”：和背景同色，只负责接住远处楼房，不抢戏
    const apron = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 90),
      new THREE.MeshBasicMaterial({ color: 0xf0ddd4, fog: true })
    );
    apron.rotation.x = -Math.PI / 2;
    apron.position.y = -DIORAMA.baseDepth - 0.06;

    scene.add(apron);

    // 箱庭底座：独立方形地块，前侧与右侧能看到厚度
    const baseGroup = new THREE.Group();
    baseGroup.name = 'diorama-base';
    const matBase = new THREE.MeshStandardMaterial({
      color: 0x4d6176, roughness: 0.5, metalness: 0.3,

    const matBaseLine = new THREE.MeshStandardMaterial({
      color: 0x9db2c6, roughness: 0.28, metalness: 0.7,

    const baseMaterials = [matBase, matBaseRim, matBaseTrim, matBaseLine];
    // 地台作为稳定的展示台先整体淡入；道路 / 标线在台面上做中心扩散
    baseMaterials.forEach((m) => {
      m.transparent = true;
      m.opacity = 0;

    const baseBody = new THREE.Mesh(new THREE.BoxGeometry(BLOCK, DIORAMA.baseDepth, BLOCK), matBase);
    baseBody.position.y = -DIORAMA.baseDepth / 2;
    baseBody.receiveShadow = true;
    baseBody.castShadow = true;
    baseGroup.add(baseBody);

    // 底部宽脚 + 内收台座：薄地台也有分层收边
    const baseFoot = new THREE.Mesh(new THREE.BoxGeometry(BLOCK + 0.4, 0.14, BLOCK + 0.4), matBaseTrim);
    baseFoot.position.y = -DIORAMA.baseDepth + 0.07;
    baseFoot.castShadow = true;
    baseFoot.receiveShadow = true;
    baseGroup.add(baseFoot);

    const baseSocle = new THREE.Mesh(new THREE.BoxGeometry(BLOCK + 0.24, 0.2, BLOCK + 0.24), matBase);
    baseSocle.position.y = -DIORAMA.baseDepth + 0.24;
    baseSocle.castShadow = true;
    baseSocle.receiveShadow = true;

    // 侧面横向细线收边
    function addBaseSeam(y, thickness, material, len) {
      [[0, len / 2], [0, -len / 2]].forEach(([x, z]) => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(len, thickness, 0.03), material);
        bar.position.set(x, y, z);
        baseGroup.add(bar);
      });
      [[len / 2, 0], [-len / 2, 0]].forEach(([x, z]) => {

        bar.position.set(x, y, z);
        baseGroup.add(bar);
      });

    addBaseSeam(-0.12, 0.03, matBaseLine, BLOCK + 0.06);
    addBaseSeam(-0.38, 0.04, matBaseTrim, BLOCK + 0.06);
    addBaseSeam(-DIORAMA.baseDepth + 0.32, 0.035, matBaseLine, BLOCK + 0.28);

    // 顶沿亮边：强化薄地台的盒子轮廓
    const rimLen = BLOCK + 0.3;
    [[0, rimLen / 2], [0, -rimLen / 2]].forEach(([x, z]) => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(rimLen, 0.12, 0.15), matBaseRim);
      bar.position.set(x, -0.05, z);
      baseGroup.add(bar);
    });
    [[rimLen / 2, 0], [-rimLen / 2, 0]].forEach(([x, z]) => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.12, rimLen), matBaseRim);
      bar.position.set(x, -0.05, z);
      baseGroup.add(bar);
    });

    scene.add(baseGroup);

    /* ---------- 十字形道路 + 四块人行道 ---------- */
    const streetSurface = new THREE.Group();
    streetSurface.name = 'street-surface';
    scene.add(streetSurface);

    const streetCurbs = new THREE.Group();
    streetCurbs.name = 'street-curbs';
    scene.add(streetCurbs);

    const roadMarkings = new THREE.Group();
    roadMarkings.name = 'road-markings';
    scene.add(roadMarkings);

    const markingBoxes = [];

    function shapeFromXZ(points) {
      const pts = points.map(([x, z]) => new THREE.Vector2(x, -z));
      if (THREE.ShapeUtils.isClockWise(pts)) pts.reverse();
      return new THREE.Shape(pts);
    }

    function worldUVShapeGeometry(shape, scale) {
      const geo = new THREE.ShapeGeometry(shape, 12);
      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        uv.setXY(i, pos.getX(i) / scale, -pos.getY(i) / scale);
      }
      uv.needsUpdate = true;
      return geo;
    }

    function makeShapeMesh(shapePoints, material, y, name, scale) {
      const mesh = new THREE.Mesh(
        worldUVShapeGeometry(shapeFromXZ(shapePoints), scale),
        material
      );
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = y;
      mesh.name = name;
      mesh.receiveShadow = true;
      streetSurface.add(mesh);
      return mesh;
    }

    // 圆弧采样：a0 → a1，返回除起点外的采样点
    function arcPoints(cx, cz, r, a0, a1, steps = 10) {
      const pts = [];
      for (let i = 1; i <= steps; i++) {
        const a = a0 + (a1 - a0) * (i / steps);
        pts.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]);
      }
      return pts;
    }

    // ---------- 四块人行道轮廓 ----------
    // 店铺地块：x -7.6~4.4，z -7.6~2.2，路口内侧 0.8 圆角
    const shopSidewalkPoints = [
      [-BLOCK_HALF, -BLOCK_HALF],
      [SIDE_ROAD_X, -BLOCK_HALF],

    function addCurbX(x0, x1, z, name) {

    function addCurbZ(x, z0, z1, name) {

    function addCurbArc(corner, a0, a1, steps, name) {
      for (let i = 0; i < steps; i++) {
        const t0 = a0 + (a1 - a0) * (i / steps);
        const t1 = a0 + (a1 - a0) * ((i + 1) / steps);
        const x0 = corner.cx + Math.cos(t0) * corner.r;
        const z0 = corner.cz + Math.sin(t0) * corner.r;
        const x1 = corner.cx + Math.cos(t1) * corner.r;
        const z1 = corner.cz + Math.sin(t1) * corner.r;
        const dx = x1 - x0;
        const dz = z1 - z0;
        addCurbPiece(
          (x0 + x1) / 2, (z0 + z1) / 2,
          Math.hypot(dx, dz) + 0.035,
          -Math.atan2(dz, dx),
          `${name}-${i}`
        );
      }
    }

    // 东南角人行道小方块

    // 四个路口转角圆弧路缘

    // 侧街斑马线：东西两端各一条缓坡
    addRamp(4.2, 0.7, 0.4, 1.3, 0, -0.2, 'ramp-side-west');

    /* ---------- 路面标线 ---------- */
    const matPaint = new THREE.MeshStandardMaterial({

    function addMarkRect(x0, x1, z0, z1, material, name, layer = 5) {
      const w = x1 - x0;

    // 校验：任意两条标线（含路钉）包围盒不得重叠
    function debugCheckMarkings() {
      const overlaps = [];
      for (let i = 0; i < markingBoxes.length; i++) {
        for (let j = i + 1; j < markingBoxes.length; j++) {
          const a = markingBoxes[i];
          const b = markingBoxes[j];

          const oz = Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0);

        }

      if (overlaps.length) console.warn('[road-markings] overlap', overlaps);

    // 第一波：原有沿街物件（隔离柱 / 红绿灯）仍跟随路灯一起从地下升起
    const streetProps = new THREE.Group();

    function addStreetMesh(mesh, name) {
      mesh.name = name;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      streetShadowProps.push(mesh);
      streetProps.add(mesh);
      return mesh;

    function addStreetGroup(group, name) {
      group.name = name;
      group.traverse((child) => {
        if (!child.isMesh) return;

        streetShadowProps.push(child);

      const group = new THREE.Group();
      group.name = name;

    // 低多边形自行车：细金属车架 + 两个圆形车轮 + 车把 / 车座
    function tubeBetween(parent, a, b, radius, material) {
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 7), material);
      mesh.position.copy(a).addScaledVector(dir, 0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createBicycle(name) {
      const group = new THREE.Group();
      group.name = name;

      const wheelGeo = new THREE.TorusGeometry(0.3, 0.026, 6, 20);
      [-0.55, 0.55].forEach((x, i) => {
        const tire = new THREE.Mesh(wheelGeo, matBikeTire);
        tire.position.set(x, 0.3, 0);
        group.add(tire);

        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.245, 0.008, 5, 18), matStreetMetal);
        rim.position.set(x, 0.3, 0);
        group.add(rim);

        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.07, 8), matStreetMetal);
        hub.rotation.x = Math.PI / 2;
        hub.position.set(x, 0.3, 0);
        group.add(hub);

        // 4 根直径辐条 = 8 根细辐条，低面数但有车轮结构
        for (let s = 0; s < 4; s++) {
          const a = (Math.PI / 4) * s;
          const dx = Math.cos(a) * 0.235;
          const dy = Math.sin(a) * 0.235;
          tubeBetween(
            group,
            new THREE.Vector3(x - dx, 0.3 - dy, 0),
            new THREE.Vector3(x + dx, 0.3 + dy, 0),
            0.0045,
            matStreetMetal
          );
        }
        if (i === 1) {
          const rack = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.18), matStreetMetal);
          rack.position.set(0.56, 0.62, 0);
          group.add(rack);
        }
      });

      // 车架三角
      const rearAxle = new THREE.Vector3(-0.55, 0.3, 0);
      const frontAxle = new THREE.Vector3(0.55, 0.3, 0);
      const bottomBracket = new THREE.Vector3(-0.04, 0.31, 0);
      const seatTop = new THREE.Vector3(-0.29, 0.76, 0);
      const headTop = new THREE.Vector3(0.42, 0.8, 0);
      const headBottom = new THREE.Vector3(0.44, 0.56, 0);

      tubeBetween(group, rearAxle, bottomBracket, 0.014, matBikeFrame);
      tubeBetween(group, rearAxle, seatTop, 0.013, matBikeFrame);
      tubeBetween(group, bottomBracket, seatTop, 0.016, matBikeFrame);
      tubeBetween(group, seatTop, headTop, 0.015, matBikeFrame);
      tubeBetween(group, bottomBracket, headBottom, 0.016, matBikeFrame);
      tubeBetween(group, headBottom, headTop, 0.017, matBikeFrame);
      tubeBetween(group, headTop, frontAxle, 0.013, matBikeFrame);

      // 车把
      tubeBetween(
        group,
        new THREE.Vector3(0.42, 0.8, 0),
        new THREE.Vector3(0.44, 0.93, 0),
        0.013,
        matBikeFrame
      );
      tubeBetween(
        group,
        new THREE.Vector3(0.44, 0.93, -0.19),
        new THREE.Vector3(0.44, 0.93, 0.19),
        0.012,
        matStreetMetal
      );
      [-0.19, 0.19].forEach((z) => {
        const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.08, 8), matBikeSaddle);
        grip.rotation.x = Math.PI / 2;
        grip.position.set(0.44, 0.93, z);
        group.add(grip);
      });

      // 座垫 + 座管
      const seatPost = tubeBetween(
        group,
        seatTop,
        new THREE.Vector3(-0.33, 0.87, 0),
        0.012,
        matStreetMetal
      );
      seatPost.name = 'bike-seat-post';
      const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.045, 0.1), matBikeSaddle);
      saddle.position.set(-0.35, 0.89, 0);
      saddle.rotation.z = -0.04;
      group.add(saddle);

      // 小脚撑
      tubeBetween(
        group,
        new THREE.Vector3(-0.04, 0.31, 0.02),
        new THREE.Vector3(-0.13, 0.01, 0.15),
        0.01,
        matStreetMetal
      );

      return group;
    }

    function createTileTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const random = mulberry32(931);

      ctx.fillStyle = '#f2e5d9';
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = 'rgba(198, 172, 156, 0.4)';
      ctx.lineWidth = 3;
      for (let i = 0; i <= 4; i++) {

        const y = random() * size;
        ctx.globalAlpha = 0.02 + random() * 0.05;
        ctx.fillStyle = random() > 0.5 ? '#ffffff' : '#c6ac9e';
        ctx.fillRect(x, y, 1 + random() * 2, 1 + random() * 2);
      }
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(7, 5);
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const text = 'YASPRETTY';
      const spacing = 28;
      ctx.font = '700 128px "Helvetica Neue", "Segoe UI", Arial, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = glow ? 'rgba(255, 220, 190, 0.42)' : '#fff8f1';

      if (glow) {
        ctx.shadowColor = 'rgba(255, 207, 164, 0.82)';
        ctx.shadowBlur = 52;
      }

      const widths = [...text].map((ch) => ctx.measureText(ch).width);
      const total = widths.reduce((sum, w) => sum + w, 0) + spacing * (text.length - 1);

      const passes = 1;
      for (let p = 0; p < passes; p++) {
        let x = (canvas.width - total) / 2;
        [...text].forEach((ch, i) => {
          ctx.fillText(ch, x, canvas.height / 2 + 4);
          x += widths[i] + spacing;
        });
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;

      ctx.fillRect(0, 0, 512, 128);
      ctx.fillStyle = foreground;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 46px Georgia, serif';
      ctx.fillText(text, 256, 65);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;

    function createCategoryLabel(text) {
      const canvas = document.createElement('canvas');

      const height = 32;
      canvas.width = width * 3;
      canvas.height = height * 3;
      const ctx = canvas.getContext('2d');
      ctx.scale(3, 3);
      ctx.fillStyle = '#e4efe5';
      ctx.beginPath();
      ctx.roundRect(1, 1, width - 2, height - 6, 9);
      ctx.fill();
      ctx.strokeStyle = '#91ab98';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(width / 2 - 4, height - 5);
      ctx.lineTo(width / 2, height - 1);
      ctx.lineTo(width / 2 + 4, height - 5);
      ctx.fill();
      ctx.fillStyle = '#365747';
      ctx.font = '500 12px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, width / 2, 14);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false, depthTest: false, toneMapped: false }));
      sprite.userData.labelSize = { width, height };

    // 商品注册：整体 Group 进 interactiveObjects，子网格共享同一份 userData
    function registerProduct(object, name, desc) {
      const data = { name, desc, root: object };
      object.userData = data;
      object.traverse((child) => {
        if (child.isMesh) child.userData = data;
      });
      interactiveObjects.push(object);
      return object;
    }

    function addProduct(object, nameId, x, y, z, rotY, name, desc) {
      object.name = nameId;
      object.position.set(x, y, z);
      object.rotation.y = rotY;
      fixtures.add(object);
      registerProduct(object, name, desc);
      return object;
    }

    function createGlowTexture() {

      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
      grad.addColorStop(0.0, 'rgba(255, 236, 205, 0.95)');
      grad.addColorStop(0.32, 'rgba(255, 205, 150, 0.42)');
      grad.addColorStop(0.72, 'rgba(255, 186, 128, 0.10)');
      grad.addColorStop(1.0, 'rgba(255, 186, 128, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;

    let framingMode = null;

      position: new THREE.Vector3(),

    // “重置视角”回到的机位（随屏幕比例更新）
    const homeView = {

    let homeCameraFov = camera.fov;
    let introCameraZoomed = false;

    const INTRO_CAMERA_ZOOM_SETTLE = INTRO_CAMERA_ZOOM_PEAK * 0.5;
    const introCameraCue = { active: false, elapsed: 0, duration: 1.05 };

      active: false,
      t: 0,

      fromTarget: new THREE.Vector3(),
      toTarget: new THREE.Vector3(),
    };

    function updateViewTween(delta) {
      if (!viewTween.active) return;

      viewTween.t = Math.min(1, viewTween.t + delta / viewTween.duration);
      const e = easeOutCubic(viewTween.t);
      camera.position.lerpVectors(viewTween.fromPos, viewTween.toPos, e);
      controls.target.lerpVectors(viewTween.fromTarget, viewTween.toTarget, e);

      if (viewTween.t >= 1) {
        viewTween.active = false;
        controls.enabled = true;
        controls.update();
      }
    }

    function resetView() {
      if (intro.active) return;

      viewTween.active = true;
      viewTween.t = 0;
      viewTween.fromPos.copy(camera.position);
      viewTween.toPos.copy(homeView.position);
      viewTween.fromTarget.copy(controls.target);
      viewTween.toTarget.copy(homeView.target);
      controls.enabled = false;
    }

    function applyResponsiveFraming() {
      if (phase !== 'shop') return;
      if (viewTween.active) {
        viewTween.active = false;
        controls.enabled = true;
      }

      const mode = camera.aspect < 1 ? 'narrow' : 'wide';
      if (mode === framingMode) return;
      framingMode = mode;

      if (mode === 'narrow') {
        camera.fov = 52;
        const halfWidth = 9;                        // 店面 + 两侧路灯 + 余量
        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
        const distance = Math.max(halfWidth / Math.tan(hFov / 2), CONFIG.minDistance * 1.3);
        const dir = CONFIG.camera.position.clone().sub(CONFIG.camera.target).normalize();
        camera.position.copy(CONFIG.camera.target).addScaledVector(dir, distance);
        controls.maxDistance = Math.max(CONFIG.maxDistance, distance + 6);
      } else {
        camera.fov = CONFIG.camera.fov;
        camera.position.copy(CONFIG.camera.position);
        controls.maxDistance = CONFIG.maxDistance;
      }

      homeView.position.copy(camera.position);
      homeView.target.copy(CONFIG.camera.target);
      homeCameraFov = camera.fov;
      if (introCameraZoomed) camera.fov = homeCameraFov - INTRO_CAMERA_ZOOM_SETTLE;
      scrollBaselineDistance = homeView.position.distanceTo(homeView.target);

      camera.updateProjectionMatrix();
      controls.update();
    }

    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width === 0 || height === 0) return;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
      renderer.setSize(width, height, false);
      applyResponsiveFraming();

    resizeObserver.observe(container);

    /* ===============================================================
     * 12. 射线拾取（框架保留，商品已注册）
     * ============================================================= */
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(-10, -10);
    let hoveredObject = null;
    let hoveredRoot = null;
    let navigationHoveredRoot = null;

    function raycast() {
      if (interactiveObjects.length === 0) return [];
      raycaster.setFromCamera(pointer, camera);
      return raycaster.intersectObjects(interactiveObjects, true);
    }

    function updateHover() {
      if (intro.active) {
        if (hoveredObject) {
          hoveredObject = null;
          hoveredRoot = null;
          renderer.domElement.style.cursor = '';
        }
        return;
      }

      const hit = raycast()[0];
      const hitInShop = hit && shop.getObjectById(hit.object.id);
      const next = hitInShop ? shop : (hit ? hit.object : null);
      if (next === hoveredObject) return;

      hoveredObject = next;
      hoveredRoot = next ? (next.userData.root || next) : null;
      renderer.domElement.style.cursor = hoveredObject ? 'pointer' : '';
    }

    // 指针坐标统一在这里换算（触屏 tap 没有 pointermove，必须用事件自身坐标）
    function updatePointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    }

    renderer.domElement.addEventListener('pointermove', (event) => {
      navigationHoveredRoot = null;
      updatePointer(event);
      updateHover();
    });

    renderer.domElement.addEventListener('pointerleave', () => {
      pointer.set(-10, -10);
      updateHover();
    });

    let pointerDownPos = null;
    renderer.domElement.addEventListener('pointerdown', (event) => {
      updatePointer(event);
      pointerDownPos = { x: event.clientX, y: event.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (event) => {
      if (!pointerDownPos) return;
      const moved = Math.hypot(event.clientX - pointerDownPos.x, event.clientY - pointerDownPos.y);
      pointerDownPos = null;
      if (moved > 6) return;
      if (intro.active || phase === 'transition') return;

      updatePointer(event);
      const hit = raycast()[0];
      if (phase === 'shop' && hit && shop.getObjectById(hit.object.id)) enterVanity();
      if (phase === 'vanity' && hit?.object.userData.category) {
        sendToSite('category', { category: hit.object.userData.category });
      }
    });

    function startScrollHandoff() {
      scrollAnchor.position.copy(camera.position);
      scrollAnchor.target.copy(controls.target);
      scrollAnchor.direction.copy(camera.position).sub(controls.target).normalize();
      scrollAnchor.distance = scrollBaselineDistance;
      camera.position.copy(scrollAnchor.target).addScaledVector(scrollAnchor.direction, scrollAnchor.distance);
      controls.update();
      scrollHandoffActive = true;
      scrollReleased = false;
      controls.enabled = true;
    }

    // 文档捕获阶段统一接管 iframe 内滚轮，避免 OrbitControls 或页面默认滚动偶发抢走事件。
    document.addEventListener('wheel', (event) => {
      if (intro.active || phase !== 'shop' || transition.active) return;
      const deltaY = event.deltaY;
      if (!Number.isFinite(deltaY) || Math.abs(deltaY) < 0.5) return;

      // 初始基准以内仍由 OrbitControls 自己缩放；只有继续缩小才进入画幅过渡。
      if (!scrollHandoffActive && deltaY > 0 && camera.position.distanceTo(controls.target) < scrollBaselineDistance - SCROLL_BASELINE_EPSILON) return;
      event.preventDefault();
      if (!scrollHandoffActive && deltaY > 0) startScrollHandoff();
      if (!scrollHandoffActive) return;
      event.stopPropagation();
      if (scrollReleased && deltaY > 0) {
        sendToSite('scroll-handoff', { deltaY, released: true });

      if (scrollReleased && deltaY < 0) scrollReleased = false;
