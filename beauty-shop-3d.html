    /* ===============================================================
     * 13. 入场动画时间轴（分层差异化生长）
     *   0.05 - 1.05s 地面与道路显影
     *   0.9  - 1.9s  路灯和街边道具出现
     *   1.5  - 2.85s 店体生成
     *   2.75 - 3.45s 柜台升起，与店体阶段衔接
     *   3.5  - 4.35s 商品落位
     * ============================================================= */
    const SHOP_MIN_SCALE = 0.015; // 店铺初始压扁到 1.5% 高度
    const FIXTURE_BURY = 2.8;     // 室内陈设整组从地面下方升起（保留原动效）
    const PRODUCT_SETTLE = 0.45;  // 商品落位的最后一段小落差
    const SIGN_EMISSIVE = 2.15;
    const SIGN_GLOW = 0.18;
    const EXPOSURE_FROM = 0.86;
    const EXPOSURE_TO = 1.08;

    function applyIntroCamera(t) {
      const fadeIn = smooth(clamp01(t / 0.5));
      const fadeOut = smooth(clamp01((INTRO_DURATION - t) / 0.75));
      const strength = fadeIn * fadeOut;
      camera.position.copy(homeView.position).add(new THREE.Vector3(
        Math.sin(t * 1.9) * 0.48 * strength,
        Math.sin(t * 2.3 + 0.5) * 0.32 * strength,
        Math.cos(t * 1.6) * 0.35 * strength
      ));
      controls.target.copy(homeView.target).add(new THREE.Vector3(
        Math.sin(t * 1.55 + 0.4) * 0.12 * strength,
        Math.cos(t * 1.8) * 0.09 * strength,
        0
      ));
    }

    function updateIntroCameraCue(delta) {
      if (!introCameraCue.active) return;
      introCameraCue.elapsed = Math.min(introCameraCue.duration, introCameraCue.elapsed + delta);
      const progress = introCameraCue.elapsed / introCameraCue.duration;
      const zoom = progress < 0.6
        ? INTRO_CAMERA_ZOOM_PEAK * smooth(progress / 0.6)
        : THREE.MathUtils.lerp(INTRO_CAMERA_ZOOM_PEAK, INTRO_CAMERA_ZOOM_SETTLE, smooth((progress - 0.6) / 0.4));
      camera.fov = homeCameraFov - zoom;
      camera.updateProjectionMatrix();
      if (introCameraCue.elapsed >= introCameraCue.duration) introCameraCue.active = false;
    }

    // 记录店体网格原本的投影状态（动画期间按进度开关，避免埋在地下时乱投影）
    const shopShadowMeshes = [];
    shop.traverse((object) => {
      if (object.isMesh) shopShadowMeshes.push({ mesh: object, cast: object.castShadow });
    });

    // 商品落位队形：delay 制造错落感
    const RISE_DELAYS = [0.30, 0.36, 0.16, 0.24, 0.06, 0.20, 0.10, 0.02];
    const RISE_DURATIONS = [0.32, 0.34, 0.28, 0.30, 0.32, 0.28, 0.30, 0.26];

    const productStates = [vanityProduct].map((object, index) => {
      const meshes = [];
      object.traverse((child) => { if (child.isMesh) meshes.push(child); });
      return {
        object,
        meshes,
        baseY: object.position.y,
        delay: RISE_DELAYS[index % RISE_DELAYS.length],
        duration: RISE_DURATIONS[index % RISE_DURATIONS.length],
        hover: 0,
        landed: null,
      };
    });

    // 商品网格的投影由升起进度单独管理，不参与店体阴影开关
    const productMeshSet = new Set();
    productStates.forEach((item) => item.meshes.forEach((mesh) => productMeshSet.add(mesh)));

    // 店铺的可见网格：灯光保持可见，避免入场时灯数变化触发着色器重新编译
    const shopVisualChildren = shop.children.filter((child) => !child.isLight && child !== fixtures && child !== categoryDisplay);

    function applyIntro(t) {
      // ---------- 1) 地台先整体淡入，完成后铺装层从中心环形扩散 ----------
      const baseP = smooth(span(t, 0.1, 0.6));
      baseMaterials.forEach((material) => {
        material.opacity = baseP;
      });
      const groundP = smooth(span(t, TIMELINE.ground[0], TIMELINE.ground[1]));
      groundReveal.radius.value = groundP * 12.4;
      const groundShadows = groundP > 0.55;
      for (let i = 0; i < streetShadowProps.length; i++) {
        streetShadowProps[i].castShadow = groundShadows;
      }

      // ---------- 2) 路灯：原地弹性缩放，灯先亮起 ----------
      streetLights.forEach((lamp, index) => {
        const start = TIMELINE.lamps[0] + index * 0.14;
        const p = span(t, start, start + 0.4);
        lamp.group.visible = true;
        lamp.group.scale.setScalar(Math.max(0.0001, easeOutBack(p)));
        lamp.group.position.y = SIDEWALK_Y;
        const lightP = smooth(span(t, start + 0.18, start + 0.6));
        lamp.light.intensity = lamp.baseIntensity * lightP;
        lamp.glow.material.opacity = 0.2 * lightP;
        lamp.pool.material.opacity = lamp.poolBaseOpacity * lightP;
      });

      // ---------- 3) 隔离柱 / 信号灯：原地错落缩放 ----------
      streetProps.children.forEach((child, index) => {
        const start = TIMELINE.streetProps[0] + index * 0.05;
        const p = span(t, start, start + 0.35);
        child.scale.setScalar(Math.max(0.0001, easeOutBack(p)));
      });
      streetProps.position.y = 0;

      const signalP = span(t, 2.0, 2.45);
      signal.scale.setScalar(Math.max(0.0001, easeOutBack(signalP)));
      signal.position.y = SIDEWALK_Y;
      const signalGlowP = smooth(span(t, 2.1, 2.6));
      for (let i = 0; i < streetGlow.length; i++) {
        streetGlow[i].material.opacity = streetGlow[i].target * signalGlowP;
      }

      // ---------- 4) 店铺：压扁后竖向长高 ----------
      const shopP = span(t, TIMELINE.shop[0], TIMELINE.shop[1]);
      const shopEase = easeOutCubic(shopP);
      shop.visible = true;
      const shopVisualOn = t >= TIMELINE.shop[0];
      for (let i = 0; i < shopVisualChildren.length; i++) {
        shopVisualChildren[i].visible = shopVisualOn;
      }
      const shopScaleY = t < TIMELINE.shop[0]
        ? 0.0001
        : SHOP_MIN_SCALE + (1 - SHOP_MIN_SCALE) * shopEase;
      shop.scale.set(1, shopScaleY, 1);
      shop.position.y = 0.045 * Math.sin(Math.PI * shopP);

      // 店内灯光 / 门头 / 门口筒灯
      const innerP = smooth(span(t, 2.0, 2.85));
      interiorLights.forEach((light) => {
        light.intensity = light.userData.baseIntensity * innerP;
      });
      const signP = smooth(span(t, 1.95, 2.85));
      signMaterial.emissiveIntensity = SIGN_EMISSIVE * signP;
      signGlow.material.opacity = SIGN_GLOW * signP;
      sideWindowMat.emissiveIntensity = 0.85 * signP;
      shopLightPool.material.opacity = 0.16 * smooth(span(t, 2.0, 2.85));

      const doorLightP = smooth(span(t, 2.1, 2.95));
      doorLampMat.emissiveIntensity = 1.9 * doorLightP;
      doorGlow.material.opacity = 0.3 * doorLightP;
      doorLightPool.material.opacity = 0.1 * doorLightP;

      const shopShadows = shopEase > 0.62;
      for (let i = 0; i < shopShadowMeshes.length; i++) {
        const entry = shopShadowMeshes[i];
        if (productMeshSet.has(entry.mesh)) continue;
        if (staticProductMeshSet.has(entry.mesh)) {
          entry.mesh.castShadow = false;
          continue;
        }
        entry.mesh.castShadow = shopShadows && entry.cast;
      }

      // ---------- 5) 室内陈设（保留原动效） ----------
      const fixtureP = span(t, TIMELINE.fixtures[0], TIMELINE.fixtures[1]);
      fixtures.visible = t >= TIMELINE.fixtures[0];
      fixtures.position.y = -FIXTURE_BURY * (1 - easeOutCubic(fixtureP));
      const fixtureShadowOn = fixtureP > 0.5;
      fixtures.traverse((mesh) => {
        if (mesh.isMesh && !staticProductMeshSet.has(mesh)) mesh.castShadow = fixtureShadowOn;
      });

      categoryDisplay.visible = t >= TIMELINE.products[0];
      categoryDisplay.position.y = 0;
      categoryObjects.forEach((object, index) => {
        const start = TIMELINE.products[0] + index * 0.055;
        const p = span(t, start, start + 0.3);
        object.position.y = object.userData.gatherStart.y + 0.18 * (1 - easeOutCubic(p));
        object.scale.setScalar(Math.max(0.001, easeOutBack(p)));
      });

      // ---------- 6) 门口小物件：原地弹性缩放 ----------
      for (let i = 0; i < forecourtItems.length; i++) {
        const item = forecourtItems[i];
        const start = TIMELINE.forecourt[0] + item.userData.delay;
        const p = span(t, start, start + 0.5);
        item.scale.setScalar(Math.max(0.0001, easeOutBack(p)));
        item.position.y = item.userData.baseY;
        const landed = p >= 0.9;
        for (let m = 0; m < item.userData.shadowMeshes.length; m++) {
          item.userData.shadowMeshes[m].castShadow = landed;
        }
      }

      // 玻璃贴花
      const decalP = smooth(span(t, 2.7, 3.65));
      for (let i = 0; i < decalMaterials.length; i++) {
        decalMaterials[i].opacity = 0.8 * decalP;
      }

      // ---------- 7) 商品（保留原动效，节奏加快） ----------
      for (let i = 0; i < productStates.length; i++) {
        const item = productStates[i];
        const start = TIMELINE.products[0] + item.delay;
        const rise = span(t, start, start + item.duration);
        item.object.position.y = item.baseY + PRODUCT_SETTLE * (1 - easeOutCubic(rise));
        const pop = rise > 0.8 ? 1 + 0.045 * Math.sin(span(rise, 0.8, 1) * Math.PI) : 1;
        item.object.scale.setScalar(pop);
        const landed = rise >= 0.9;
        item.landed = landed;
        for (let m = 0; m < item.meshes.length; m++) item.meshes[m].castShadow = landed;
      }

      // ---------- 8) 收尾提亮 ----------
      renderer.toneMappingExposure =
        EXPOSURE_FROM + (EXPOSURE_TO - EXPOSURE_FROM) * smooth(span(t, 3.0, INTRO_DURATION));
      applyIntroCamera(t);
    }

    const intro = {
      active: true,
      paused: false,
      elapsed: 0,
      duration: INTRO_DURATION,

      reset() {
        this.active = true;
        this.paused = false;
        this.elapsed = 0;
        introCameraCue.active = false;
        introCameraZoomed = false;
        camera.fov = homeCameraFov;
        camera.updateProjectionMatrix();
        controls.enabled = false;

        productStates.forEach((item) => {
          item.landed = null;
          item.hover = 0;
        });

        applyIntro(0);
        renderer.shadowMap.needsUpdate = true;
      },

      finish() {
        const animateCameraCue = !this.paused && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        this.active = false;
        this.paused = false;
        this.elapsed = this.duration;

        applyIntro(this.duration);

        groundReveal.radius.value = 30;
        groundRevealMaterials.forEach(({ material, wasTransparent }) => {
          material.transparent = wasTransparent;
          material.needsUpdate = true;
        });
        baseMaterials.forEach((material) => {
          material.opacity = 1;
          material.transparent = false;
        });
        streetGlow.forEach((entry) => {
          entry.material.opacity = entry.target;
        });

        streetLights.forEach((lamp) => {
          lamp.group.visible = true;
          lamp.group.scale.setScalar(1);
          lamp.group.position.y = SIDEWALK_Y;
          lamp.light.intensity = lamp.baseIntensity;
          lamp.glow.material.opacity = 0.2;
          lamp.pool.material.opacity = lamp.poolBaseOpacity;
        });

        streetSurface.position.y = 0;
        streetCurbs.position.y = 0;
        streetProps.position.y = 0;
        streetProps.children.forEach((child) => child.scale.setScalar(1));
        signal.scale.setScalar(1);
        signal.position.y = SIDEWALK_Y;
        roadMarkings.visible = true;
        roadMarkings.position.y = 0;
        forecourtItems.forEach((item) => {
          item.scale.setScalar(1);
          item.position.y = item.userData.baseY;
          for (let m = 0; m < item.userData.shadowMeshes.length; m++) {
            item.userData.shadowMeshes[m].castShadow = true;
          }
        });
        decalMaterials.forEach((material) => { material.opacity = 0.8; });
        fixtures.visible = true;
        fixtures.position.y = 0;
        categoryDisplay.visible = true;
        categoryDisplay.position.y = 0;
        categoryObjects.forEach((object) => {
          object.position.copy(object.userData.gatherStart);
          object.scale.setScalar(1);
        object.rotation.set(0, object.userData.startRotation, 0);
        });
        shop.visible = true;
        shop.scale.set(1, 1, 1);
        shop.position.y = 0;
        interiorLights.forEach((light) => { light.intensity = light.userData.baseIntensity; });
        signMaterial.emissiveIntensity = SIGN_EMISSIVE;
        signGlow.material.opacity = SIGN_GLOW;
        sideWindowMat.emissiveIntensity = 0.85;
        shopLightPool.material.opacity = 0.16;
        doorLampMat.emissiveIntensity = 1.9;
        doorGlow.material.opacity = 0.3;
        doorLightPool.material.opacity = 0.1;
        productStates.forEach((item) => {
          item.object.position.y = item.baseY;
          item.object.scale.setScalar(1);
          item.landed = true;
          for (let m = 0; m < item.meshes.length; m++) item.meshes[m].castShadow = true;
        });
        renderer.toneMappingExposure = EXPOSURE_TO;

        introCameraZoomed = animateCameraCue;
        introCameraCue.active = animateCameraCue;
        introCameraCue.elapsed = 0;

        controls.enabled = true;
        renderer.shadowMap.needsUpdate = true;
      },

      // 调试 / 复看：跳到任意时间点并暂停
      seek(t) {
        this.reset();
        this.elapsed = THREE.MathUtils.clamp(t, 0, this.duration);
        this.paused = true;
        applyIntro(this.elapsed);
        if (this.elapsed >= this.duration) this.finish();
      },

      replay() {
        this.reset();
      },

      pause() {
        this.paused = true;
      },

      resume() {
        if (this.elapsed < this.duration) {
          this.paused = false;
          this.active = true;
          controls.enabled = false;
        }
      },
    };

    intro.reset();
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) intro.finish();
    else if (window.parent !== window) intro.pause();

    // 预编译店铺 / 路灯 / 陈设的着色器，避免出场瞬间集中编译造成卡顿
    renderer.compile(scene, camera);

    function sendToSite(type, detail = {}) {
      if (window.parent !== window) {
        window.parent.postMessage({ source: 'yaspretty-beauty-shop', type, ...detail }, window.location.origin);
      }
    }

    const focusGroup = new THREE.Group();
    focusGroup.name = 'vanity-focus';
    scene.add(focusGroup);
    const focusLight = new THREE.PointLight(0xffdfc7, 0, 8);
      focusLight.position.set(1.35, 3.1, -0.25);
    scene.add(focusLight);
    const focusFill = new THREE.HemisphereLight(0xfff6ed, 0x9d7775, 0);
    scene.add(focusFill);
    let focusPrepared = false;
    let scatterRecords = [];
    let scatterProgress = 0;
    let categoryGatherProgress = 0;
    let shopHover = 0;
    const transition = {
      active: false, elapsed: 0, duration: 2.25, from: 0, to: 0,
      fromPosition: new THREE.Vector3(), toPosition: new THREE.Vector3(),
      fromTarget: new THREE.Vector3(), toTarget: new THREE.Vector3(),
      destination: 'shop',
    };

    const shopHoverLight = new THREE.PointLight(0xffd4c2, 0, 12, 2);
    shopHoverLight.position.set(-0.15, 2.4, -2.5);
    scene.add(shopHoverLight);
    const shopHoverFill = new THREE.PointLight(0xffe3d2, 0, 9, 2);
    shopHoverFill.position.set(1.7, 2.25, 0.8);
    scene.add(shopHoverFill);

    const exteriorMaterials = new Map();
    const exteriorRoots = [baseGroup, streetSurface, streetCurbs, roadMarkings, streetProps, signal, ...forecourtItems];
    exteriorRoots.forEach((root) => root.traverse((object) => {
      if (!object.isMesh || !object.material) return;
      const originalMaterials = Array.isArray(object.material) ? object.material : [object.material];
      const localMaterials = originalMaterials.map((material) => {
        if (!exteriorMaterials.has(material)) {
          const local = material.clone();
          const baseIndex = baseMaterials.indexOf(material);
          if (baseIndex >= 0) baseMaterials[baseIndex] = local;
          groundRevealMaterials.forEach((entry) => {
            if (entry.material === material) entry.material = local;
          });
          exteriorMaterials.set(material, {
            material: local,
            color: local.color?.clone(),
            emissive: local.emissive?.clone(),
          });
          return local;
        }
        return exteriorMaterials.get(material).material;
      });
      object.material = Array.isArray(object.material) ? localMaterials : localMaterials[0];
    }));

    function prepareFocus() {
      if (focusPrepared) return;
      focusPrepared = true;
      // Detach from the neutral shop transform, not its temporary hover enlargement.
      shop.scale.setScalar(1);
      shop.position.y = 0;
      shop.updateMatrixWorld(true);
      focusGroup.attach(vanityProduct);
      categoryObjects.forEach((object) => focusGroup.attach(object));

      const movingObjects = [
        ...scene.children.filter((object) => object !== shop && object !== focusGroup && !object.isLight),
        ...shop.children.filter((object) => object !== fixtures && object !== categoryDisplay && !object.isLight),
        ...fixtures.children,
      ];
      scatterRecords = movingObjects.map((object, index) => {
        const world = object.getWorldPosition(new THREE.Vector3());
        const angle = Math.atan2(world.z + 1.35, world.x - 0.7) + (index % 5 - 2) * 0.17;
        const distance = 10 + index % 4 * 1.7;
      const groundLike = /floor|ground|surface|paving|tile|road|sidewalk|curb|base|plinth|marking|rug|threshold/i.test(object.name || '');
        const underVanity = Math.abs(world.x - 1.08) < 1.45 && world.z > -3.0 && world.z < -0.55 && world.y < 1.35;
        return {
          object,
          position: object.position.clone(),
          rotation: object.rotation.clone(),
          scale: object.scale.clone(),
          groundLike,
          offset: groundLike
            ? new THREE.Vector3(Math.cos(angle) * 2.4, 0, Math.sin(angle) * 2.4)
            : underVanity
            ? new THREE.Vector3(Math.cos(angle) * 1.1, -(4.8 + index % 3 * 0.8), Math.sin(angle) * 1.1)
            : new THREE.Vector3(Math.cos(angle) * distance, (index % 4 - 1) * 2.1, Math.sin(angle) * distance),
          turn: (index % 2 ? -1 : 1) * (0.12 + index % 3 * 0.08),
        };
      });
    }

    function applyScatter(amount) {
      for (const item of scatterRecords) {
        item.object.position.copy(item.position).addScaledVector(item.offset, amount);
        item.object.rotation.set(item.rotation.x + item.turn * amount * 0.4, item.rotation.y + item.turn * amount, item.rotation.z + item.turn * amount * 0.55);
        const fade = item.groundLike
          ? smooth(clamp01(amount / 0.3))
          : smooth(clamp01((amount - 0.62) / 0.38));
        if (item.groundLike) {
          const leaveGround = smooth(clamp01((amount - 0.3) / 0.45));
          item.object.position.y = item.position.y - leaveGround * (1.2 + (item.object.id % 3) * 0.15);
        }
        item.object.scale.copy(item.scale).multiplyScalar(1 - fade);
      }
      focusLight.intensity = amount * 1.8;
      focusFill.intensity = amount * 1.2;
      interiorLights.forEach((light) => { light.intensity = light.userData.baseIntensity * (1 - amount * 0.65); });
      renderer.toneMappingExposure = THREE.MathUtils.lerp(EXPOSURE_TO, 1.02, amount);
      shopHoverLight.intensity = 3.2 * amount;
      apron.visible = amount < 0.82;
      renderer.shadowMap.needsUpdate = true;
    }

    function applyCategoryGather(amount) {
      categoryGatherProgress = amount;
      const progress = clamp01(amount);
      const gatherCenter = new THREE.Vector3(vanityCenter[0], 3.95, vanityCenter[2]);
      categoryObjects.forEach((object, index) => {
        const start = object.userData.gatherStart;
        const target = object.userData.gatherTarget;
        const phaseOffset = index * Math.PI * 0.25;
        const orbitAngle = phaseOffset;
        const orbitPoint = gatherCenter.clone().add(new THREE.Vector3(
          Math.cos(orbitAngle) * 1.35,
          Math.sin(orbitAngle * 0.5) * 0.2,
          Math.sin(orbitAngle) * 1.0
        ));

        if (progress <= 0.34) {
          const t = smooth(progress / 0.34);
          object.position.lerpVectors(start, orbitPoint, t);
          object.position.y += Math.sin(t * Math.PI) * 0.3;
        } else if (progress <= 0.66) {
          const t = (progress - 0.34) / 0.32;
          const circle = phaseOffset + t * Math.PI * 2;
          object.position.set(
            gatherCenter.x + Math.cos(circle) * 1.35,
            gatherCenter.y + Math.sin(circle * 2) * 0.2,
            gatherCenter.z + Math.sin(circle) * 1.0
          );
        } else {
          const t = smooth((progress - 0.66) / 0.34);
          const landingAngle = phaseOffset + (1 - t) * Math.PI * 3;
          const radius = (1 - t) * 0.65;
          const spiralPoint = target.clone().add(new THREE.Vector3(
            Math.cos(landingAngle) * radius,
            Math.sin(Math.PI * t) * 0.6,
            Math.sin(landingAngle) * radius
          ));
          object.position.lerpVectors(orbitPoint, spiralPoint, t);
        }

        // Keep the flight spin, but land upright at the table's intended orientation.
        const settling = smooth(clamp01((progress - 0.66) / 0.34));
        const wobble = Math.sin(progress * Math.PI);
        const spin = progress * Math.PI * 6;
        object.rotation.set(
          Math.sin(progress * Math.PI * 2 + phaseOffset) * 0.16 * wobble,
          THREE.MathUtils.lerp(object.userData.startRotation, object.userData.gatherRotation, settling) + spin,
          Math.cos(progress * Math.PI * 2 + phaseOffset) * 0.12 * wobble
        );
        object.scale.setScalar(1);
      });
    }

    function focusCameraPosition() {
      const target = new THREE.Vector3(1.08, 1.25, -1.82);
      const direction = new THREE.Vector3(0.55, 0.78, 1.35).normalize();
      return { target, position: target.clone().addScaledVector(direction, camera.aspect < 0.8 ? 5.45 : 3.65) };
    }

    function beginTransition(destination) {
      if (intro.active || phase === 'transition' || phase === destination) return;
      prepareFocus();
      viewTween.active = false;
      hoveredRoot = null;
      hoveredObject = null;
      navigationHoveredRoot = null;
      pointer.set(-10, -10);
      transition.active = true;
      transition.elapsed = 0;
      transition.from = scatterProgress;
      transition.to = destination === 'vanity' ? 1 : 0;
      transition.fromPosition.copy(camera.position);
      transition.fromTarget.copy(controls.target);
      const focus = focusCameraPosition();
      transition.toPosition.copy(destination === 'vanity' ? focus.position : homeView.position);
      transition.toTarget.copy(destination === 'vanity' ? focus.target : homeView.target);
      transition.destination = destination;
      phase = 'transition';
      controls.enabled = false;
      controls.minDistance = 2.5;
      controls.maxDistance = Math.max(CONFIG.maxDistance, homeView.position.length() + 6);
      interactiveObjects.length = 0;
      sendToSite('stage', { stage: 'transition' });
    }

    function enterVanity() { beginTransition('vanity'); }
    function returnToShop() { beginTransition('shop'); }

    function updateTransition(delta) {
      if (!transition.active) return;
      transition.elapsed = Math.min(transition.duration, transition.elapsed + delta);
      const progress = transition.elapsed / transition.duration;
      const amount = smooth(progress);
      const scatterTiming = transition.destination === 'vanity'
        ? smooth(clamp01(progress * 1.8))
        : smooth(clamp01((progress - 0.12) / 0.88));
      scatterProgress = THREE.MathUtils.lerp(transition.from, transition.to, scatterTiming);
      applyScatter(scatterProgress);
      applyCategoryGather(transition.destination === 'vanity' ? smooth(clamp01(progress * 1.08)) : 1 - smooth(clamp01((progress - 0.08) / 0.92)));
      camera.position.lerpVectors(transition.fromPosition, transition.toPosition, amount);
      controls.target.lerpVectors(transition.fromTarget, transition.toTarget, amount);
      controls.update();
      if (transition.elapsed < transition.duration) return;
      transition.active = false;
      phase = transition.destination;
      applyCategoryGather(transition.destination === 'vanity' ? 1 : 0);
      categoryObjects.forEach((object) => {
        object.userData.labelSprite.visible = false;
      });
      controls.enabled = true;
      controls.minDistance = phase === 'vanity' ? 2.5 : CONFIG.minDistance;
      controls.maxDistance = phase === 'vanity' ? 9 : Math.max(CONFIG.maxDistance, homeView.position.length() + 6);
      interactiveObjects.push(...(phase === 'vanity' ? categoryObjects : [shop]));
      sendToSite('stage', { stage: phase });
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || event.origin !== window.location.origin || event.data?.source !== 'yaspretty-site') return;
      if (event.data.type === 'return') returnToShop();
      if (event.data.type === 'enter') enterVanity();
      if (event.data.type === 'start-intro') intro.resume();
      if (event.data.type === 'category-hover' && phase === 'vanity') {
        navigationHoveredRoot = categoryObjects.find((object) => object.userData.category === event.data.category) || null;
        if (navigationHoveredRoot) {
          pointer.set(-10, -10);
          hoveredObject = null;
          hoveredRoot = null;
        }
        lastActivityAt = performance.now();
      }
      if (event.data.type === 'scroll-exit-progress') {
        const progress = THREE.MathUtils.clamp(Number(event.data.progress) || 0, 0, 1);
        scrollReleased = progress >= 1;
        if (scrollHandoffActive) {
          scrollAnchor.target.copy(controls.target);
          scrollAnchor.direction.copy(camera.position).sub(controls.target).normalize();
          const distance = THREE.MathUtils.lerp(scrollAnchor.distance, controls.maxDistance, progress);
          camera.position.copy(scrollAnchor.target).addScaledVector(scrollAnchor.direction, distance);
          controls.target.copy(scrollAnchor.target);
          controls.update();
        }
        if (progress <= 0) {
          scrollHandoffActive = false;
          scrollReleased = false;
          controls.enabled = true;
        }
      }
    });

    /* ===============================================================
     * 14. 渲染循环
     * ============================================================= */
    const clock = new THREE.Clock();
    let lastDrawAt = 0;
    let lastActivityAt = performance.now();
    controls.addEventListener('change', () => { lastActivityAt = performance.now(); });
    container.addEventListener('pointermove', () => { lastActivityAt = performance.now(); }, { passive: true });

    // 悬浮高亮：整组轻微抬起 + 放大（材质是共享的，所以不改 per-mesh 颜色）
    function updateProductHover(delta) {
      const k = Math.min(1, delta * 9);
      const shopTarget = phase === 'shop' && hoveredRoot === shop ? 1 : 0;
      const previousShopHover = shopHover;
      shopHover = THREE.MathUtils.lerp(shopHover, shopTarget, k);
      const introScaleY = intro.active ? shop.scale.y : 1;
      const shopScale = 1 + shopHover * 0.055;
      if (intro.active) shop.scale.set(1, introScaleY, 1);
      else shop.scale.setScalar(shopScale);
      shop.position.y = intro.active ? shop.position.y : shopHover * 0.045;
      shopHoverLight.intensity = shopHover * 8.5;
      shopHoverFill.intensity = shopHover * 5.5;
      if (Math.abs(shopHover - previousShopHover) > 0.0005) {
        exteriorMaterials.forEach(({ material, color, emissive }) => {
          if (color) material.color.copy(color).multiplyScalar(1 - shopHover * 0.58);
          if (emissive) material.emissive.copy(emissive).multiplyScalar(1 - shopHover * 0.42);
        });
      }
      if (!intro.active) {
        interiorLights.forEach((light) => {
          light.intensity = light.userData.baseIntensity * (1 + shopHover * 0.24);
        });
      }
      for (let i = 0; i < productStates.length; i++) {
        const item = productStates[i];
        const target = (!intro.active && phase === 'shop' && item.object === hoveredRoot) ? 1 : 0;
        item.hover += (target - item.hover) * k;

        if (!intro.active) {
          item.object.position.y = item.baseY + item.hover * 0.05;
          item.object.scale.setScalar(1 + item.hover * 0.06);
        }
      }
      const vanityGlow = vanityProduct.getObjectByName('vanity-underglow');
      if (vanityGlow) vanityGlow.material.opacity = 0.18 + (shopHover * 0.18);
      for (const object of categoryObjects) {
        const target = phase === 'vanity' && object === (hoveredRoot || navigationHoveredRoot) ? 1 : 0;
        object.userData.hover = THREE.MathUtils.lerp(object.userData.hover || 0, target, k);
        object.scale.setScalar(1 + object.userData.hover * 0.1);
        if (object.userData.labelSprite) {
          object.userData.labelSprite.visible = phase === 'vanity' && object.userData.hover > .02;
          object.userData.labelSprite.material.opacity = object.userData.hover;
        }
      }
    }

    // Keep labels at a readable CSS-pixel size when zooming, including on narrow screens.
    const labelCameraPoint = new THREE.Vector3();
    const labelWorldScale = new THREE.Vector3();
    function updateCategoryLabels() {
      for (const object of categoryObjects) {
        const label = object.userData.labelSprite;
        if (!label.visible) continue;
        label.getWorldPosition(labelCameraPoint).applyMatrix4(camera.matrixWorldInverse);
        object.getWorldScale(labelWorldScale);
        const unitsPerPixel = 2 * Math.max(.1, -labelCameraPoint.z) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / container.clientHeight;
        const { width, height } = label.userData.labelSize;
        label.scale.set(width * unitsPerPixel / labelWorldScale.x, height * unitsPerPixel / labelWorldScale.y, 1);
      }
    }

    let reportedReady = false;
    function renderFrame(time) {
      const active = (intro.active && !intro.paused) || introCameraCue.active || transition.active || viewTween.active || hoveredRoot || navigationHoveredRoot || shopHover > 0.001 || time - lastActivityAt < 600;
      if (!active && time - lastDrawAt < 66) return;
      lastDrawAt = time;
      const delta = Math.min(clock.getDelta(), 0.05);

      if (intro.active && !intro.paused) {
        intro.elapsed = Math.min(intro.elapsed + delta, intro.duration);
        applyIntro(intro.elapsed);
        if (intro.elapsed >= intro.duration) intro.finish();
        renderer.shadowMap.needsUpdate = true;
      }

      updateIntroCameraCue(delta);
      updateProductHover(delta);
      updateViewTween(delta);
      updateTransition(delta);
      controls.update();
      updateCategoryLabels();
      renderer.render(scene, camera);
      if (!reportedReady) {
        reportedReady = true;
        sendToSite('ready', { stage: 'shop' });
      }
    }

    let sceneInView = true;
    let loopRunning = false;
    function syncRenderLoop() {
      const shouldRun = sceneInView && !document.hidden;
      if (shouldRun === loopRunning) return;
      loopRunning = shouldRun;
      if (shouldRun) clock.getDelta();
      renderer.setAnimationLoop(shouldRun ? renderFrame : null);
    }
    const visibilityObserver = new IntersectionObserver(([entry]) => {
      sceneInView = entry.isIntersecting;
      syncRenderLoop();
    }, { rootMargin: '120px' });
    visibilityObserver.observe(container);
    document.addEventListener('visibilitychange', syncRenderLoop);
    syncRenderLoop();

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && phase === 'vanity') returnToShop();
    });

    /* ===============================================================
     * 16. 调试出口（控制台可直接调用）
     * ============================================================= */
    window.BeautyShop = {
      THREE, scene, camera, renderer, controls,
      ground: shopSidewalk, road, sideRoad, shop, glass, sign, doorGroup, threshold,
      shopSidewalk, swSidewalk, neSidewalk, seSidewalk,
      streetLights, interiorLights, interactiveObjects, productStates,
      streetProps, forecourtItems, roadMarkings, streetSurface, streetCurbs,
      markingBoxes, debugCheckMarkings, doorLampMat,
      decalMaterials, intro, TIMELINE, resetView, enterVanity, returnToShop, categoryObjects,
      get categoryGatherProgress() { return categoryGatherProgress; },
    };
  </script>
</body>
</html>
